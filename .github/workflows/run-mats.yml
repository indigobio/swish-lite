name: run-mats
on: [push]
jobs:
  mats:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Build Chez Scheme
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          TAG=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
                https://api.github.com/repos/cisco/ChezScheme/releases/latest | jq -r '.tag_name')
          git clone --filter=blob:none --branch "$TAG" --quiet https://github.com/cisco/ChezScheme.git
          cd ChezScheme
          ./configure --nothreads --disable-x11
          make
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$PWD/a6nt/bin/a6nt" >> "$GITHUB_PATH"
          else
            sudo make install
          fi
      - name: Run mats
        working-directory: ${{ github.workspace }}
        shell: bash
        run: src/run-mats
